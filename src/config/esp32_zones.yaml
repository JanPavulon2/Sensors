# Remote zones rendered on ESP32 nodes (Phase 6 - "stream state, not frames")
#
# Unlike zones.yaml (physical LED strips wired directly to the RPi's own GPIO
# pins, rendered every frame by FrameManager), each zone listed here lives on
# a remote ESP32 node's own addressable strip. The RPi only pushes zone STATE
# changes (color/brightness/is_on) to the node - the node renders the pixels
# itself. See docs/architecture-vnext/05-esp32-rpi-roadmap.md Phase 6.
#
# node_id must match the MAC address the ESP32 reports in its heartbeat
# (visible in the Serial monitor on boot, or via GET /api/v1/nodes once it's
# online). sync_group is optional - nodes sharing a sync_group stay
# phase-locked by MultiNodeSyncBroadcaster (Phase 7).

remote_zones:
  - node_id: "04:B2:47:9B:BD:E8"
    zone_label: "esp32_strip_1"
    display_name: "Workshop Strip"
    pixel_count: 30
    sync_group: "workshop"

  - node_id: "11:22:33:44:55:66"
    zone_label: "esp32_strip_2"
    display_name: "Porch Strip"
    pixel_count: 30
    sync_group: "workshop"
